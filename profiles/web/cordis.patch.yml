# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# `@deepseek-ai/dsh-hmr` watches this file and package.json, so edits recompose
# the running profile live; a newly added dependency still needs `pnpm install`.
# Registered client plugins. The six local UI plugins listed below are supplied
# by the `@zhp-dev/zar-desktop` bundle (packages/bundles/zar-desktop), which owns
# their row ids — this file must not insert them:
# - per-turn "Edits" view (@zar-desktop/ui-edits)
# - cumulative per-file "Changes" view (@zar-desktop/ui-changes)
# - git history tree graph tab (@zar-desktop/ui-git; host git remote — see its HOST_PRIMITIVES.md)
# - chat-header session metrics (@zar-desktop/ui-session-metrics; replaces the
#   bottom-of-chat stats pills and the composer context meter — see its INTEGRATION.md)
# - view-tab icons (@zar-desktop/ui-chat-tab-icons; Chat/Trajectory/Edits/Changes/Git)
# - chat-header To-dos pill (@zar-desktop/ui-todo-pill; replaces the composer's
#   To-dos card and shadows its dock cell — see its INTEGRATION.md)
# - podman container MCP server (@deepseek-ai/dsh-mcp-client; tools under mcp__podman__*)
# They stay `link:` dependencies of this profile (pnpm links under
# profiles/web/node_modules), so reinstall them after a harness upgrade with:
#   dsh plugin --profile web add link:<package dir>
# Disabling or removing the `@zhp-dev/zar-desktop` bundle removes all six at once;
# never re-add them as `insert` rows here, because two layers inserting the same
# id make the loader throw "entry <id> already exists in the target tree".
# The legacy profiles/node_modules shared fallback and the empty
# profiles/web/.dsh-module-fallback projection were removed on 2026-09-18 and are
# not read by runtime resolution (the launcher default since 0.1.6-alpha.2), so a
# link placed there silently fails to resolve.
# The shipped ui-deliverables row provides the produced-files chips and the
# chatFileMentions provider; it stays enabled now that the local ui-files
# plugin that used to supersede it is removed.
- id: ui-deliverables
# The shipped web-app bundle disables sandboxed HTTP(S) Browser tabs unless the
# profile is named `desktop` ("Web profiles opt in"); this Web profile opts
# back in so the right Sidebar keeps its Browser tab.
- id: ui-sidebar-browser
  disabled: false
- insert:
    - id: mcp-podman
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: podman
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'podman-mcp-server@latest'
        toolCallTimeoutMs: 120000
        failOnStartupError: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    variantFont: Adwaita Sans
    monoFont: Monaspace Neon
    preference: dark
    fontSize: 14
    codeFontSize: 13
    textFontFamily: '"Adwaita Sans"'
    codeFontFamily: '"Monaspace Neon"'
    fontColorDark: "#bfc0bf"
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      deepseek:
        baseURL: https://napi.nroad.com.cn/v1
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek V4 Flash Vision Exp
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
        apiKeyEnv: DEEPSEEK_API_KEY
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    performanceUsage: detailed
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek
    model: deepseek-v4-flash

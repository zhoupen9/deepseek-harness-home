# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Registered client plugins:
# - per-turn "Edits" view (@deepseek-ai/dsh-client-ui-edits)
# - cumulative per-file "Changes" view (@deepseek-ai/dsh-client-ui-changes)
# - session-known "Files" explorer + chat file-link viewer (@deepseek-ai/dsh-client-ui-files)
# The shipped ui-deliverables row also provides chatFileMentions; ui-files
# supersedes it (and is the only plugin allowed to provide a single-shot
# slot service). Disable the bundle row here or the second provide throws.
- id: ui-deliverables
  disabled: true
- insert:
    - id: ui-edits
      name: '@deepseek-ai/dsh-client-ui-edits'
    - id: ui-changes
      name: '@deepseek-ai/dsh-client-ui-changes'
    - id: ui-files
      name: '@deepseek-ai/dsh-client-ui-files'

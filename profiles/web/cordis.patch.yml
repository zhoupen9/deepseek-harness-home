# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Registered client plugins:
# - per-turn "Edits" view (@deepseek-ai/dsh-client-ui-edits)
# - cumulative per-file "Changes" view (@deepseek-ai/dsh-client-ui-changes)
# - git history tree graph tab (@deepseek-ai/dsh-client-ui-git; host git remote — see its HOST_PRIMITIVES.md)
# - chat-header session metrics (@deepseek-ai/dsh-client-ui-session-metrics; replaces the
#   bottom-of-chat stats pills and the composer context meter — see its INTEGRATION.md)
# - view-tab icons (@deepseek-ai/dsh-client-ui-chat-tab-icons; Chat/Trajectory/Edits/Changes/Git)
# - podman container MCP server (@deepseek-ai/dsh-mcp-client; tools under mcp__podman__*)
# The five local plugins are profile-local dependencies of this profile (pnpm
# links under profiles/web/node_modules); reinstall after a harness upgrade
# with:
#   dsh plugin --profile web add link:<package dir>
# The legacy profiles/node_modules shared fallback and the empty
# profiles/web/.dsh-module-fallback projection were removed on 2026-09-18.
# Runtime resolution (the launcher default since 0.1.6-alpha.2) never reads
# either position, so a link placed there silently fails to resolve.
# The shipped ui-deliverables row provides the produced-files chips and the
# chatFileMentions provider; it stays enabled now that the local ui-files
# plugin that used to supersede it is removed.
- id: ui-deliverables
# The shipped web-app bundle disables sandboxed HTTP(S) Browser tabs unless the
# profile is named `desktop` ("Web profiles opt in"); this Web profile opts
# back in so the right Sidebar keeps its Browser tab.
- id: ui-sidebar-browser
  disabled: false
- insert:
    - id: ui-edits
      name: '@deepseek-ai/dsh-client-ui-edits'
    - id: ui-changes
      name: '@deepseek-ai/dsh-client-ui-changes'
    - id: ui-git
      name: '@deepseek-ai/dsh-client-ui-git'
    - id: ui-session-metrics
      name: '@deepseek-ai/dsh-client-ui-session-metrics'
    - id: ui-chat-tab-icons
      name: '@deepseek-ai/dsh-client-ui-chat-tab-icons'
    - id: mcp-podman
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: podman
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'podman-mcp-server@latest'
        toolCallTimeoutMs: 120000
        failOnStartupError: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek
    model: deepseek-v4-flash
    reasoningEffort: max
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
    fontSize: 14
    variantFont: Adwaita Sans
    monoFont: Monaspace Neon
    fontColorDark: "#bfc0bf"
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      deepseek:
        baseURL: https://napi.nroad.com.cn/v1
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek V4 Flash Vision Exp
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
        apiKeyEnv: DEEPSEEK_API_KEY
